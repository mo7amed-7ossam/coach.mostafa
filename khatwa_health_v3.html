<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خُطوة | رحلتك الصحية</title>
<style>
:root{--bg:#f3f6f1;--ink:#142820;--mut:#708178;--green:#193e30;--lime:#c9f28b;--line:#e2e9e2;--white:#fff;--orange:#e7a85b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1250px;margin:auto;display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#143629;color:white;padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-size:31px;font-weight:900;margin:5px 12px 30px}.brand span{color:var(--lime)}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#d0e2d5;text-align:right;padding:14px;border-radius:13px;margin:3px 0}.nav.active,.nav:hover{background:#315643;color:#fff}.main{padding:30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:23px;flex-wrap:wrap}h1{font-size:29px;margin:0 0 5px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}.sub,.muted{color:var(--mut);font-size:13px}.hero{background:linear-gradient(120deg,#193f30,#32644b);border-radius:23px;color:white;padding:26px;margin-bottom:20px}.hero h2{font-size:26px;margin-bottom:8px}.hero p{color:#d8e8da}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:19px;margin-bottom:15px;min-width:0}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.metric strong{display:block;font-size:25px;margin-top:9px}.pill{border:1px solid #d7e5d5;background:#f3f8ef;border-radius:100px;padding:8px 13px;color:var(--green);font-weight:650}.primary{background:var(--green);color:white;border:0;border-radius:11px;padding:12px 16px;font-weight:700}.secondary{background:#eef5e8;color:var(--green);border:1px solid #d8e5d1;border-radius:11px;padding:11px 15px}.danger{color:#a3482b}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:11px}.field{display:grid;gap:6px;font-size:13px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e3d8;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:72px}.bar{height:9px;background:#e8eee6;border-radius:20px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#7eb94f;border-radius:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid #dce5dc;background:white;border-radius:10px;padding:9px 13px}.tab.active{background:var(--green);color:white}.foodrow{display:grid;grid-template-columns:1fr 100px 100px auto;gap:9px;align-items:end;border-bottom:1px solid var(--line);padding:12px 0}.foodrow .field{min-width:0}.tiny{font-size:12px;color:var(--mut)}.chart{width:100%;height:220px;display:block}.meal-card{padding:13px;border:1px solid var(--line);border-radius:14px;margin:10px 0}.meal-card.selected{border-color:#70a45d;background:#f6fbf2}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:auto}.progressline{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.notice{background:#fff8e8;border:1px solid #f2dfb7;padding:13px;border-radius:12px;font-size:13px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:20px;background:#173d2e;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:9}.smallbtn{border:0;border-radius:9px;background:#eef4e9;padding:8px 10px}.foot{font-size:12px;color:#76867a;margin-top:25px;line-height:1.8}.bottom{display:none}canvas{max-width:100%}@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:16px 14px 95px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;background:#173d2e;padding:7px;justify-content:space-around;z-index:5}.bottom button{background:none;border:0;color:white;font-size:11px;padding:8px 3px}.foodrow{grid-template-columns:1fr 80px;gap:8px}.foodrow .price{grid-column:1}.foodrow button{grid-column:2}.hero{padding:19px}.hero h2{font-size:22px}}@media print{.side,.bottom,button{display:none!important}.app{display:block}.main{padding:0}.card{break-inside:avoid}}
</style></head><body><div class="app"><aside class="side"><div class="brand">خُطوة<span>.</span></div><div id="sideNav"></div><p style="font-size:12px;color:#b9d0c0;margin:25px 12px">رحلتك الصحية، خطوة بخطوة.</p></aside><main class="main"><div class="top"><div><h1 id="pageTitle">لوحة اليوم</h1><div class="sub" id="todayText"></div></div><div class="row"><input type="date" id="date" style="width:165px"><button class="pill" onclick="go('settings')">⚙ الإعدادات</button></div></div><div id="view"></div><div class="foot">الأرقام الغذائية تقديرية وليست بديلًا عن تقييم طبي. لا تغيّر أدوية أو تتجاهل ألمًا متفاقمًا اعتمادًا على التطبيق. البيانات تُحفظ محليًا في هذا المتصفح فقط؛ صدّر نسخة احتياطية بانتظام.</div></main></div><nav class="bottom" id="bottomNav"></nav><div class="toast" id="toast"></div>
<script>
const KEY='khatwa_v3_data', names={home:'الرئيسية',meals:'وجباتي',exercise:'نشاطي وظهري',progress:'تقدمي',report:'التقرير',roadmap:'90 يوم',groceries:'المشتريات',rescue:'إنقاذ اليوم',prep:'تحضير الوجبات',settings:'الإعدادات'}, icons={home:'⌂',meals:'◈',exercise:'◉',progress:'↗',report:'▤',roadmap:'◎',groceries:'▣',rescue:'✦',prep:'◷',settings:'⚙'};
const foods=[
['chicken','دجاج مشوي',165,31,3.6,'بروتين'],['fish','سمك أبيض مشوي',110,23,2,'بروتين'],['beef','لحم قليل الدهون',200,27,9,'بروتين'],['eggs','بيض مسلوق',155,13,11,'بروتين'],['tuna','تونة بالماء',116,26,1,'بروتين'],['turkey','ديك رومي مشوي',145,29,2,'بروتين'],['rice','أرز مطبوخ',130,2.7,.3,'نشويات'],['potato','بطاطس مسلوقة',87,2,.1,'نشويات'],['bread','خبز أسمر',250,9,3,'نشويات'],['oats','شوفان جاف',389,17,7,'نشويات'],['vegetables','خضار مطبوخ',40,2,.5,'خضار'],['salad','سلطة بدون صوص',25,1.2,.3,'خضار'],['apple','تفاح',52,.3,.2,'فاكهة'],['banana','موز',89,1.1,.3,'فاكهة'],['yogurt','زبادي بروتين خالي اللاكتوز',65,10,.5,'ألبان'],['olive','زيت زيتون',884,0,100,'دهون'],['almond','لوز',579,21,50,'دهون'],['cottage','جبن قريش قليل الدسم',98,11,4,'ألبان']];
const presets=[
{name:'دجاج وأرز وخضار',items:[['chicken',200],['rice',200],['vegetables',200],['olive',5]]},
{name:'سمك وبطاطس',items:[['fish',200],['potato',300],['vegetables',200],['olive',5]]},
{name:'بيض وخبز وخضار',items:[['eggs',120],['bread',80],['salad',150]]},
{name:'شوفان وزبادي وموز',items:[['oats',60],['yogurt',200],['banana',120]]},
{name:'دجاج وبطاطس وسلطة',items:[['chicken',200],['potato',250],['salad',200],['olive',5]]},
{name:'ديك رومي وأرز',items:[['turkey',200],['rice',200],['vegetables',200],['olive',5]]},
{name:'جبن قريش وخبز',items:[['cottage',150],['bread',80],['salad',150]]}
];
const mealNames={breakfast:'الفطار',lunch:'الغداء',snack:'السناك',dinner:'العشاء'};
const blank=()=>({meals:{breakfast:[],lunch:[],snack:[],dinner:[]},water:0,activity:[],painBefore:null,painAfter:null,painNext:null,weight:null,waist:null,notes:'',sleep:null,fast:null});
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!data||!data.days)data={days:{},target:2300,protein:130,start:'2026-10-14',favorites:[],planned:{},settings:{}};let page='home',selectedMeal='lunch',tab='weight';
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let date=localDate();function daily(d=date){if(!data.days[d])data.days[d]=blank();return data.days[d]}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function food(id){return foods.find(f=>f[0]===id)||foods[0]}
function nutrients(items){return items.reduce((a,[id,g])=>{const f=food(id);a.cal+=f[2]*g/100;a.pro+=f[3]*g/100;a.fat+=f[4]*g/100;return a},{cal:0,pro:0,fat:0})}
function totals(d=daily()){return nutrients(Object.values(d.meals||{}).flat())}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function nav(){document.getElementById('sideNav').innerHTML=Object.keys(names).map(k=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')">${icons[k]}　${names[k]}</button>`).join('');document.getElementById('bottomNav').innerHTML=['home','meals','exercise','progress','report'].map(k=>`<button onclick="go('${k}')">${icons[k]}<br>${names[k]}</button>`).join('')}
function go(p){page=p;document.getElementById('pageTitle').textContent=names[p];nav();render();window.scrollTo(0,0)}
function setDate(v){date=v;render()}
function setField(k,v){daily()[k]=v;save();render()}
function card(s){return `<section class="card">${s}</section>`}
function pct(n,d){return Math.min(100,Math.max(0,d?100*n/d:0))}
function fmt(n){return Math.round(n||0).toLocaleString('ar-EG')}
function home(){const d=daily(),t=totals(d),act=d.activity.reduce((a,x)=>a+x.minutes,0),logged=Object.values(d.meals).filter(x=>x.length).length;return `<div class="hero"><div class="sub" style="color:#bce6bf">رحلتك الصحية</div><h2>كل خطوة بتفرق.</h2><p>ركّز على الانتظام، مش الكمال. وجبتك القادمة، حركتك، وراحتك.</p><button class="secondary" onclick="go('meals')">+ سجل وجبة</button> <button class="secondary" onclick="go('rescue')">✦ اليوم اتلخبط؟</button></div><div class="grid">
${metric('السعرات',fmt(t.cal)+' / '+fmt(data.target),'سعرة تقريبًا',pct(t.cal,data.target))}
${metric('البروتين',fmt(t.pro)+' / '+fmt(data.protein),'جرام',pct(t.pro,data.protein))}
${metric('المياه',(d.water/1000).toFixed(2)+' لتر','هدف مرن 2.5 لتر',pct(d.water,2500))}
${metric('الحركة',act+' دقيقة','مشي ونشاط مسجل',pct(act,20))}
</div><div class="two" style="margin-top:16px">${card(`<h2>تسجيل سريع</h2><div class="stack"><div class="row"><b>المياه</b><div><button class="smallbtn" onclick="changeWater(-250)">− 250</button> <button class="primary" onclick="changeWater(250)">+ 250 مل</button></div></div><div class="row"><b>وزن اليوم</b><input type="number" step=".1" min="20" max="400" style="width:125px" value="${d.weight??''}" placeholder="كجم" onchange="setNumber('weight',this.value)"></div><div class="row"><b>وجبات مسجلة</b><span>${logged}/4</span></div><button class="secondary" onclick="go('exercise')">سجّل المشي وألم الظهر ←</button></div>`)}
${card(`<h2>وجبة مقترحة</h2><h3>دجاج مشوي مع أرز وخضار</h3><p class="muted">تقدر تبدّل البروتين أو النشويات قبل التسجيل.</p><div class="row"><b>${fmt(nutrients(presets[0].items).cal)} سعرة</b><button class="primary" onclick="addPreset(0,'lunch');go('meals')">أضف للغداء</button></div>`)}
</div>${card(`<h2>ملخص آخر 7 أيام</h2><canvas id="homeChart" class="chart"></canvas><p class="tiny">الرسم يعرض الأوزان المسجلة فقط، ولا يفترض وجود قياسات لم تدخلها.</p>`)}`}
function metric(label,value,sub,percent){return `<div class="metric"><span class="muted">${label}</span><strong>${value}</strong><div class="bar"><div class="fill" style="width:${percent}%"></div></div><span class="tiny">${sub}</span></div>`}
function changeWater(n){daily().water=Math.max(0,daily().water+n);save();render()}
function setNumber(k,v){daily()[k]=v===''?null:Number(v);save();render()}
function addPreset(i,m=selectedMeal){daily().meals[m].push(...presets[i].items.map(x=>[...x]));save();toast('تمت إضافة الوجبة');render()}
function addFood(){daily().meals[selectedMeal].push(['chicken',100]);save();render()}
function editFood(i,k,v){const row=daily().meals[selectedMeal][i];row[k]=k===1?Math.max(0,Number(v)||0):v;save();render()}
function removeFood(i){daily().meals[selectedMeal].splice(i,1);save();render()}
function meals(){const d=daily(),items=d.meals[selectedMeal],n=nutrients(items);return `${card(`<h2>وجبات جاهزة</h2><p class="muted">اختر وجبة ثم عدّل أي مكوّن أو كميته. الكميات بالجرام والبيانات تقريبية.</p><div class="two">${presets.map((p,i)=>`<div class="meal-card"><b>${p.name}</b><div class="tiny">${fmt(nutrients(p.items).cal)} سعرة · ${fmt(nutrients(p.items).pro)} جم بروتين</div><button class="secondary" style="margin-top:10px" onclick="addPreset(${i})">+ أضف للوجبة المختارة</button></div>`).join('')}</div>`)}
${card(`<h2>حاسبة الوجبة</h2><div class="tabs">${Object.keys(mealNames).map(k=>`<button class="tab ${selectedMeal===k?'active':''}" onclick="selectedMeal='${k}';render()">${mealNames[k]}</button>`).join('')}</div>${items.length?items.map(([id,g],i)=>`<div class="foodrow"><label class="field">الصنف<select onchange="editFood(${i},0,this.value)">${foods.map(f=>`<option value="${f[0]}" ${f[0]===id?'selected':''}>${f[1]}</option>`).join('')}</select></label><label class="field">جرام<input type="number" min="0" step="10" value="${g}" onchange="editFood(${i},1,this.value)"></label><div class="price"><b>${fmt(food(id)[2]*g/100)}</b><div class="tiny">سعرة</div></div><button class="smallbtn danger" onclick="removeFood(${i})">حذف</button></div>`).join(''):'<p class="muted">لم تُضف أصنافًا لهذه الوجبة بعد.</p>'}<div class="row" style="margin-top:16px"><button class="secondary" onclick="addFood()">+ أضف صنفًا</button><b>${fmt(n.cal)} سعرة · ${fmt(n.pro)} جم بروتين</b></div>`)}
${card(`<h2>إجمالي اليوم</h2><div class="grid">${metric('سعرات اليوم',fmt(totals(d).cal), 'من '+data.target,pct(totals(d).cal,data.target))}${metric('بروتين اليوم',fmt(totals(d).pro)+' جم','من '+data.protein,pct(totals(d).pro,data.protein))}</div><p class="tiny">الدهون والكربوهيدرات والبيانات الغذائية تختلف حسب نوع المنتج وطريقة الطبخ. لا تستخدم الأرقام كقياس طبي دقيق.</p>`)}`}
function exercise(){const d=daily();return `${card(`<h2>سجل النشاط</h2><div class="two"><label class="field">نوع النشاط<select id="actType"><option>مشي خفيف</option><option>دراجة ثابتة</option><option>تمارين علاج طبيعي موصوفة</option><option>نشاط آخر</option></select></label><label class="field">المدة بالدقائق<input id="actMinutes" type="number" min="1" max="240" value="15"></label></div><button class="primary" style="margin-top:12px" onclick="addActivity()">إضافة النشاط</button>${d.activity.map((a,i)=>`<div class="progressline"><span>${safe(a.type)} · ${a.minutes} دقيقة</span><button class="smallbtn" onclick="daily().activity.splice(${i},1);save();render()">حذف</button></div>`).join('')}`)}
${card(`<h2>مراقبة الظهر</h2><p class="muted">درجة الألم من صفر إلى عشرة. سجّل الألم قبل وبعد النشاط، وفي اليوم التالي.</p><div class="two">${[['painBefore','قبل النشاط'],['painAfter','بعد النشاط'],['painNext','في اليوم التالي']].map(([k,label])=>`<label class="field">${label}<select onchange="setField('${k}',this.value===''?null:Number(this.value))"><option value="">لم أسجل</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${d[k]===i?'selected':''}>${i}/10</option>`).join('')}</select></label>`).join('')}</div><label class="field" style="margin-top:12px">ملاحظات وأعراض<textarea onchange="setField('notes',this.value)">${safe(d.notes)}</textarea></label>${d.painBefore!==null&&d.painAfter!==null&&d.painAfter>d.painBefore?'<div class="notice" style="margin-top:12px">الألم زاد بعد النشاط. خفّض أو أوقف النشاط الذي يزيد الألم، واطلب تقييمًا إذا استمر أو اشتد.</div>':''}<p class="tiny">ضعف جديد بالرجل، فقدان التحكم بالبول أو البراز، أو خدر بمنطقة العجان يتطلب تقييمًا طبيًا عاجلًا.</p>`)}`}
function addActivity(){const min=Number(document.getElementById('actMinutes').value);if(!(min>0&&min<=240))return toast('أدخل مدة صحيحة');daily().activity.push({type:document.getElementById('actType').value,minutes:min});save();render()}
function recent(n=90){return Object.entries(data.days).filter(([k])=>k<=date).sort((a,b)=>a[0].localeCompare(b[0])).slice(-n)}
function progress(){const entries=recent();return `${card(`<h2>تطور الوزن والنشاط</h2><div class="tabs"><button class="tab ${tab==='weight'?'active':''}" onclick="tab='weight';render()">الوزن</button><button class="tab ${tab==='activity'?'active':''}" onclick="tab='activity';render()">دقائق النشاط</button><button class="tab ${tab==='pain'?'active':''}" onclick="tab='pain';render()">ألم الظهر</button></div><canvas id="progressChart" class="chart"></canvas><p class="tiny">متوسط 7 أيام للوزن يظهر عندما تتوفر قياسات كافية. عدم وجود بيانات لا يُفسَّر كصفر.</p>`)}
${card(`<h2>قياسات اليوم</h2><div class="two"><label class="field">الوزن (كجم)<input type="number" min="20" max="400" step=".1" value="${daily().weight??''}" onchange="setNumber('weight',this.value)"></label><label class="field">محيط الخصر (سم)<input type="number" min="30" max="250" step=".1" value="${daily().waist??''}" onchange="setNumber('waist',this.value)"></label></div><p class="muted">يكفي قياس الوزن صباحًا في ظروف متشابهة، ومحيط الخصر أسبوعيًا.</p>`)}`}
function weekData(){const end=new Date(date+'T12:00:00'),start=new Date(end);start.setDate(start.getDate()-6);return Object.entries(data.days).filter(([k])=>new Date(k+'T12:00:00')>=start&&k<=date)}
function report(){const ds=weekData(),logged=ds.filter(([,d])=>Object.values(d.meals).some(a=>a.length)),avg=logged.length?logged.reduce((a,[,d])=>a+totals(d).cal,0)/logged.length:null,weights=ds.filter(([,d])=>d.weight!==null).map(([,d])=>d.weight),mins=ds.reduce((a,[,d])=>a+d.activity.reduce((x,y)=>x+y.minutes,0),0),pain=ds.filter(([,d])=>d.painAfter!==null).map(([,d])=>d.painAfter);return `${card(`<h2>تقرير آخر 7 أيام حتى ${date}</h2><div class="grid">${metric('أيام تسجيل الطعام',logged.length+' / 7','لا يساوي الالتزام بالنظام',pct(logged.length,7))}${metric('متوسط السعرات المسجلة',avg===null?'—':fmt(avg),'لأيام التسجيل فقط',0)}${metric('إجمالي الحركة',mins+' دقيقة','النشاط المسجل',0)}${metric('متوسط ألم ما بعد النشاط',pain.length?(pain.reduce((a,b)=>a+b,0)/pain.length).toFixed(1)+'/10':'—','عند توفر تسجيل',0)}</div><p class="muted">تغير الوزن المسجل: ${weights.length>=2?(weights.at(-1)-weights[0]).toFixed(1)+' كجم':'غير كافٍ للحساب'}</p>`)}
${card(`<h2>قرارات الأسبوع القادم</h2><div class="stack">${logged.length<4?'<div class="notice">الأولوية: تسجيل الطعام بانتظام قبل تغيير السعرات.</div>':'<div class="notice">راجع متوسط الوزن والوجبات، ولا تعدل السعرات اعتمادًا على يوم واحد.</div>'}${pain.some(x=>x>=7)?'<div class="notice">سجلت ألمًا مرتفعًا؛ ناقش النشاط مع طبيب أو أخصائي علاج طبيعي.</div>':'<div class="notice">استمر بنشاط مريح، ولا ترفع الأحمال دون تقييم ملائم للظهر.</div>'}<div class="notice">راقب النوم والمعدة، وحافظ على المرونة بدل التعويض أو التجويع.</div></div><button class="secondary" style="margin-top:15px" onclick="window.print()">طباعة التقرير</button>`)}`}
function roadmap(){const start=new Date((data.start||'2026-10-14')+'T12:00:00'),cur=new Date(date+'T12:00:00'),num=Math.max(1,Math.floor((cur-start)/86400000)+1),steps=[['1–14','بناء العادة','تثبيت الوجبات وتسجيل الأكل والمشي حسب التحمل'],['15–30','تحسين الانتظام','مراجعة الوزن والنوم والمعدة، دون تشدد في الصيام'],['31–60','تطوير النشاط','مقاومة تدريجية فقط بعد التقييم الطبي المناسب'],['61–90','الاستدامة','تحليل الاتجاهات وتحسين الخيارات وإعادة التقييم']];return `${card(`<h2>رحلة 90 يوم</h2><div class="row"><b>اليوم ${Math.min(num,90)} من 90</b><span class="muted">تاريخ البداية ${data.start}</span></div><div class="bar"><div class="fill" style="width:${pct(num,90)}%"></div></div>${steps.map((s,i)=>`<div class="progressline"><div><b>${s[0]} · ${s[1]}</b><div class="muted">${s[2]}</div></div><span>${num>Number(s[0].split('–')[1])?'✓':num>=Number(s[0].split('–')[0])?'●':'○'}</span></div>`).join('')}<p class="tiny">الخطة لا تضمن رقمًا محددًا على الميزان، وتحسن دهون الكبد يحتاج متابعة وفحوصًا طبية.</p>`)}`}
function groceries(){let aggregate={};const plan=Object.values(data.planned).flat();plan.forEach(i=>{(presets[i]?.items||[]).forEach(([id,g])=>aggregate[id]=(aggregate[id]||0)+g)});return `${card(`<h2>خطط وجبات الأسبوع</h2><p class="muted">اختَر عدد مرات تحضير كل وجبة. القائمة تجمع الكميات تلقائيًا وفق أوزان الوصفات المطبوخة، قبل تحويلها لمشتريات فعلية.</p>${presets.map((p,i)=>`<div class="progressline"><div><b>${p.name}</b><div class="tiny">${fmt(nutrients(p.items).cal)} سعرة للحصة</div></div><div class="row"><button class="smallbtn" onclick="planChange(${i},-1)">−</button><b>${(data.planned[i]||[]).length}</b><button class="smallbtn" onclick="planChange(${i},1)">+</button></div></div>`).join('')}`)}
${card(`<h2>قائمة المكونات</h2>${Object.keys(aggregate).length?Object.entries(aggregate).map(([id,g])=>`<div class="progressline"><span>${food(id)[1]}</span><b>${fmt(g)} جم</b></div>`).join(''):'<p class="muted">اختَر وجبات أولًا لتظهر القائمة.</p>'}<p class="tiny">هذه كميات الوصفات كما سُجلت، ومعظمها بعد الطهي. اشترِ كمية نيئة أكبر بحسب فاقد الطهي، ولا تعتمد تحويلًا ثابتًا لكل الأصناف.</p><button class="primary" onclick="copyGrocery()">نسخ المشتريات</button>`)}`}
function planChange(i,n){let a=data.planned[i]||[];if(n>0)a.push(i);else a.pop();data.planned[i]=a;save();render()}
function copyGrocery(){let a={};Object.values(data.planned).flat().forEach(i=>(presets[i]?.items||[]).forEach(([id,g])=>a[id]=(a[id]||0)+g));copy(Object.entries(a).map(([id,g])=>`${food(id)[1]}: ${g} جم (وزن الوصفة)`).join('\n'))}
function rescue(){return `${card(`<h2>✦ وضع إنقاذ اليوم</h2><p>لو فاتتك وجبة أو أكلت أكتر من المخطط، مش مطلوب تعاقب نفسك أو تصوم فترة طويلة لتعويضها.</p><div class="stack">${[['فاتتني وجبة','كمّل الوجبة التالية في موعد مناسب، وخليها متوازنة.'],['طلبت أكل من برّه','اختَر بروتين مشوي وخضار ونشويات مناسبة، وسجل تقديرًا بدل ترك اليوم بلا تسجيل.'],['أكلت أكثر من المخطط','ارجع لنظامك المعتاد في الوجبة التالية؛ لا تجويع ولا تمرين عقابي.'],['ظهري تعبني','أوقف النشاط الذي يزيد الألم، وسجل الأعراض واطلب تقييمًا إذا استمر أو اشتد.']].map(x=>`<div class="meal-card"><b>${x[0]}</b><p class="muted">${x[1]}</p></div>`).join('')}</div><button class="primary" onclick="go('meals')">ارجع لتسجيل وجباتك</button>`)}`}
function prep(){return `${card(`<h2>تحضير الوجبات مسبقًا</h2><p class="muted">خطط لوجبات بسيطة يمكن تجهيزها مسبقًا، وابدأ بكميات صغيرة تناسب ثلاجتك وجدولك.</p><div class="stack"><div class="meal-card"><b>1. اختر 2–3 وصفات</b><p class="muted">دجاج مشوي، سمك، وأرز أو بطاطس وخضار.</p></div><div class="meal-card"><b>2. جهز الحصص</b><p class="muted">قسّم الوجبات في عبوات منفصلة مع كتابة تاريخ التحضير.</p></div><div class="meal-card"><b>3. خزّن بأمان</b><p class="muted">برّد الطعام سريعًا، وضع ما ستأكله خلال 3–4 أيام في الثلاجة عند 4°م أو أقل، وجمّد الباقي. أعد التسخين جيدًا.</p></div><div class="meal-card"><b>4. أنشئ قائمة مشتريات</b><p class="muted">اجمع المكونات من صفحة المشتريات.</p></div></div><button class="primary" onclick="go('groceries')">افتح المشتريات</button>`)}`}
function settings(){return `${card(`<h2>الأهداف والإعدادات</h2><div class="two"><label class="field">هدف السعرات اليومي (تقديري)<input type="number" min="1000" max="5000" value="${data.target}" onchange="data.target=Number(this.value);save();render()"></label><label class="field">هدف البروتين (جرام)<input type="number" min="30" max="250" value="${data.protein}" onchange="data.protein=Number(this.value);save();render()"></label><label class="field">بداية خطة 90 يوم<input type="date" value="${data.start}" onchange="data.start=this.value;save();render()"></label></div><p class="tiny">الأهداف أولية وليست وصفة علاجية. راجع السعرات والبروتين مع مختص عند توفر الوزن والتحاليل، خاصةً مع مشاكل الكبد والمرارة والمعدة.</p>`)}
${card(`<h2>بياناتك ونسخك الاحتياطية</h2><p class="muted">كل البيانات محفوظة محليًا على هذا المتصفح. لا توجد مزامنة سحابية أو حساب مستخدم في هذه النسخة.</p><div class="row"><button class="primary" onclick="exportJSON()">تصدير نسخة JSON</button><button class="secondary" onclick="exportCSV()">تصدير CSV</button><label class="secondary" style="cursor:pointer">استيراد JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></label></div><p class="tiny">لا تمسح بيانات المتصفح قبل أخذ نسخة احتياطية. الملف القديم قد يستخدم صيغة تخزين مختلفة؛ احتفظ بنسخة منه ومن بياناته.</p>`)}`}
function copy(s){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('تم النسخ')).catch(()=>fallbackCopy(s));else fallbackCopy(s)}
function fallbackCopy(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('تم النسخ')}
function exportJSON(){download('khatwa-backup.json',JSON.stringify(data,null,2),'application/json')}
function exportCSV(){let rows=[['date','calories','protein_g','water_ml','activity_minutes','weight_kg','waist_cm','pain_before','pain_after','pain_next']];Object.entries(data.days).sort().forEach(([k,d])=>rows.push([k,Math.round(totals(d).cal),Math.round(totals(d).pro),d.water,d.activity.reduce((a,x)=>a+x.minutes,0),d.weight??'',d.waist??'',d.painBefore??'',d.painAfter??'',d.painNext??'']));download('khatwa-report.csv','\ufeff'+rows.map(r=>r.join(',')).join('\n'),'text/csv')}
function download(name,s,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([s],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importJSON(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj.days||typeof obj.days!=='object')throw Error('invalid');if(!confirm('استيراد النسخة سيستبدل البيانات الحالية. هل أنت متأكد؟'))return;data=obj;save();render();toast('تم الاستيراد')}catch(e){alert('ملف غير صالح لهذا الإصدار')}};r.readAsText(file)}
function draw(canvas,vals,labels,color='#407c59'){if(!canvas)return;const ctx=canvas.getContext('2d'),w=canvas.clientWidth||650,h=220,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e0e8df';for(let i=0;i<4;i++){let y=20+i*52;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-15,y);ctx.stroke()}if(!vals.length){ctx.fillStyle='#73877b';ctx.textAlign='center';ctx.font='14px sans-serif';ctx.fillText('سجّل بياناتك لتظهر هنا',w/2,h/2);return}let min=Math.min(...vals),max=Math.max(...vals);if(max===min){min-=1;max+=1}let x=i=>30+i*(w-48)/Math.max(1,vals.length-1),y=v=>195-(v-min)/(max-min)*155;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.stroke();vals.forEach((v,i)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(i),y(v),4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#6c8173';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText(max.toFixed(1),2,20);ctx.fillText(min.toFixed(1),2,195);ctx.fillText(labels[0]||'',30,216);ctx.textAlign='right';ctx.fillText(labels.at(-1)||'',w-15,216)}
function charts(){if(page==='home'){const es=recent(7).filter(([,d])=>d.weight!==null);draw(document.getElementById('homeChart'),es.map(x=>x[1].weight),es.map(x=>x[0].slice(5)))}if(page==='progress'){const es=recent(30).filter(([,d])=>tab==='weight'?d.weight!==null:tab==='activity'?d.activity.length>0:d.painAfter!==null);draw(document.getElementById('progressChart'),es.map(([,d])=>tab==='weight'?d.weight:tab==='activity'?d.activity.reduce((a,x)=>a+x.minutes,0):d.painAfter),es.map(x=>x[0].slice(5)))}}
function render(){document.getElementById('date').value=date;document.getElementById('todayText').textContent=new Date(date+'T12:00:00').toLocaleDateString('ar-OM',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('view').innerHTML=({home,meals,exercise,progress,report,roadmap,groceries,rescue,prep,settings}[page])();requestAnimationFrame(charts)}
document.getElementById('date').addEventListener('change',e=>setDate(e.target.value));nav();render();
</script></body></html>
